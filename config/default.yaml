assistant:
  name: Victor
  address_user_as: Sir
  wake_word: Victor

security:
  max_failed_attempts: 3
  lockout_seconds: 60
  session_timeout_minutes: 15
  # Never commit this file's contents - it holds only an Argon2id hash,
  # never the plaintext phrase. Path is git-ignored by default.
  secrets_path: config/secrets.yaml

voice:
  enabled: false # enabled starting Phase 8

ui:
  orb_enabled: false # enabled starting Phase 10

greeting:
  morning_start: "05:00"
  afternoon_start: "12:00"
  evening_start: "17:00"
  night_start: "21:00"

logging:
  level: INFO
  directory: logs
  max_bytes: 5242880 # 5 MB per log file before rotation
  backup_count: 5

filesystem:
  # Directories Victor's filesystem tools are allowed to touch.
  # "~" is expanded to the user's home directory at load time.
  # Any resolved path outside these roots is rejected (rule 7).
  allowed_roots:
    - "~"
  # Cap on how many bytes read_file will load into memory at once.
  max_read_bytes: 1048576

computer:
  # Explicit whitelist of applications Victor may open/close.
  # Victor will refuse anything not listed here - it never launches
  # an arbitrary path just because a request (or future LLM output)
  # names one. Add entries for your own machine, e.g.:
  #   notepad: notepad.exe
  #   chrome: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  applications:
    notepad: notepad.exe
  screenshot_directory: screenshots

browser:
  # Whether Playwright launches a visible or headless browser.
  headless: true
  default_timeout_ms: 10000